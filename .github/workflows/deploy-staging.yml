# DEPRECATED: staging is not part of the JT2J delivery model and is not a
# prerequisite for production. Retained only for legacy operator references.
name: JT2J deprecated staging deployment

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Git revision to deploy
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: jt2j-staging
  cancel-in-progress: false

jobs:
  gates:
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ inputs.revision }}
    secrets: inherit

  deploy:
    needs: gates
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      - name: Trust deployment host
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Forward-only staging migration gate (failure stops; no automatic rollback)
        if: ${{ success() }}
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          APP_DIR: ${{ secrets.STAGING_APP_DIR }}
          REVISION: ${{ inputs.revision }}
        run: |
          app_dir_b64="$(printf '%s' "$APP_DIR" | base64 -w0)"
          revision_b64="$(printf '%s' "$REVISION" | base64 -w0)"
          ssh "$USER@$HOST" "bash -s -- '$app_dir_b64' '$revision_b64'" <<'REMOTE'
          set -eu
          APP_DIR="$(printf '%s' "$1" | base64 -d)"
          REVISION="$(printf '%s' "$2" | base64 -d)"
          cd -- "$APP_DIR"
          git fetch --tags origin -- "$REVISION"
          git checkout --detach -- "$REVISION"
          pnpm install --frozen-lockfile
          pnpm cms:migrate
          pnpm build
          systemctl restart jt2j-staging
          REMOTE
      - name: Smoke staging public surface (required post-deploy gate)
        if: ${{ success() }}
        env:
          SMOKE_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          SMOKE_CONTACT_TOKEN: ${{ secrets.STAGING_CONTACT_SMOKE_TOKEN }}
        run: pnpm smoke:public
      - name: Record deployment failure and require manual rollback decision
        if: ${{ failure() }}
        run: |
          echo '::error::Staging deployment failed. No automatic rollback was performed; use the approved manual rollback procedure.'
          exit 1
