function options(name,items,selected,full=false){return `<div class="field ${full?'full':''}"><label for="${name}">${t('form.'+name)}</label><select id="${name}" name="${name}">${items.map(([v,l])=>`<option value="${esc(v)}" ${selected===v?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`}
function contact(){const p=P.CONTACT[lang],div=params.get('division')||formDraft.division||'',srv=params.get('service')||formDraft.service||'',intent=params.get('intent')||formDraft.intent||'general',d=D.find(d=>d.code===div);return `${simpleHero(p,'contact')}<section class="section light" style="padding-top:40px"><div class="wrap contact-layout"><aside class="contact-details"><div class="contact-unit"><div class="eyebrow">${bi('PAR E-MAIL','EMAIL')}</div><a href="mailto:info@jt2j.com">info@jt2j.com</a></div><div class="contact-unit"><div class="eyebrow">${bi('PAR TÉLÉPHONE','PHONE')}</div><a href="tel:+243974004510">+243 974 004 510</a></div><div class="contact-unit"><div class="eyebrow">${bi('RÉSEAUX SOCIAUX','SOCIAL MEDIA')}</div><p>@jt2jcompany</p></div><div class="contact-unit"><div class="eyebrow">${bi('IMPLANTATIONS MENTIONNÉES','LOCATIONS MENTIONED')}</div><p>Lubumbashi ${bi('et','and')} Kolwezi<br>${bi('République démocratique du Congo','Democratic Republic of the Congo')}</p></div><div class="contact-unit" style="grid-column:1/-1">${lineLink(t('nav.faq'),url('faq'))}</div></aside><div class="form-panel"><h2>${t('form.heading')}</h2><p class="intro-text">${t('form.intro')}</p><div class="demo-info">${bi('Démonstration du formulaire : aucune demande n’est enregistrée ou transmise. Vous pourrez vérifier le récapitulatif puis préparer un e-mail.','Form demonstration: no request is recorded or transmitted. You can review your enquiry and then prepare an email.')}</div>${d?`<div class="context-chip">${icon(d.code)}JT2J ${esc(d.title[lang])}</div>`:''}<form id="quote-form" novalidate><div class="form-grid">${options('intent',['general','quote','partnership','other'].map(x=>[x,t('form.intent.'+x)]),intent,true)}${options('division',[['',t('form.division.none')],...D.map(d=>[d.code,d.title[lang]])],div)}${options('service',[['',t('form.service.none')],...S.filter(s=>!div||s.division===div).map(s=>[s.slug,s.title[lang]])],srv)}${field('fullName','text')}${field('organization','text')}${field('email','email')}${field('phone','tel')}${field('city','text',true)}${field('message','textarea',true)}</div><label class="check-row"><input type="checkbox" name="consent" id="consent" ${formDraft.consent?'checked':''}><span>${bi('Je comprends qu’il s’agit d’une démonstration locale et qu’aucun message ne sera envoyé par ce formulaire.','I understand that this is a local demonstration and that this form will not send a message.')}</span></label><div id="form-error" class="form-error" role="alert"></div><button type="submit" class="btn dark">${bi('Vérifier ma demande','Review my enquiry')}${arrow()}</button><p class="form-fine">${bi('Évitez de transmettre des données confidentielles ou sensibles dans votre premier message.','Please avoid sharing confidential or sensitive information in your initial message.')}<br>${bi('Pour le moment, contactez-nous par e-mail ou par téléphone.','For now, please reach us by email or phone.')}</p><div class="sr-only" aria-hidden="true"><label for="website">${t('form.honeypot')}</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div></form></div></div></section>`}
function systemPage(kind){const titles={missing:bi('Cette page n’existe pas.','This page doesn’t exist.'),error:bi('Une erreur est survenue.','Something went wrong.'),received:bi('Aucune demande n’a été envoyée.','No request has been sent.'),pending:bi('Une page en préparation.','A page in preparation.')},body={missing:bi('Le lien est peut-être incorrect ou la page a été déplacée.','The link may be incorrect or the page may have moved.'),error:bi('Nous ne pouvons pas afficher cette page pour le moment.','We can’t display this page right now.'),received:bi('Ce prototype ne dispose pas d’un service d’enregistrement. Vous pouvez préparer une demande et la transmettre vous-même par e-mail.','This prototype has no request storage service. You can prepare an enquiry and send it yourself by email.'),pending:bi('Cette section reste masquée jusqu’à la validation des informations et des droits de publication prévus dans le dossier.','This section remains hidden until the information and publication permissions specified in the brief have been approved.')};return `<section class="system-page"><div class="wrap"><div class="system-number">${kind==='missing'?'404':kind==='error'?'500':'JT2J COMPANY'}</div><h1>${titles[kind]}</h1><p>${body[kind]}</p><div class="actions">${btn(t('cta.go_home'),url(),'dark')}${lineLink(t('cta.contact'),url('contact'))}</div></div></section>`}
function legalPage(key){const title={legal:bi('Mentions légales','Legal notice'),privacy:bi('Politique de confidentialité','Privacy policy'),cookies:bi('Gestion des cookies','Cookie preferences')}[key],missing={legal:bi('Dénomination et forme légales ; immatriculation ; adresse ; responsable de publication ; hébergeur ; propriété intellectuelle.','Legal name and form; registration; address; publication manager; hosting provider; intellectual property.'),privacy:bi('Responsable ; données collectées ; finalités et base juridique ; destinataires ; conservation ; transferts ; droits et contact.','Controller; collected data; purposes and legal basis; recipients; retention; transfers; rights and contact.'),cookies:bi('Le prototype n’installe pas de traceurs publicitaires ni de mesure d’audience. La langue sélectionnée peut être conservée localement dans ce navigateur. La politique du futur site devra correspondre aux outils réellement installés.','The prototype installs no advertising or analytics trackers. The selected language may be kept locally in this browser. The future site policy must reflect the tools actually installed.')}[key];return `${breadcrumb([[title]])}<section class="system-page"><div class="wrap"><div class="eyebrow" style="color:var(--gold-dark);margin-bottom:25px">${bi('GABARIT DE PRÉSENTATION','PRESENTATION TEMPLATE')}</div><h1>${title}</h1><p>${bi('Document juridique en préparation. Ce gabarit n’est pas un texte légal approuvé et ne doit pas être utilisé pour une mise en ligne publique.','Legal document pending approval. This template is not an approved legal text and must not be used for a public launch.')}</p><div class="legal-list">${esc(missing)}</div><div class="actions">${btn(bi('Retour à l’atelier','Back to the studio'),url('studio'),'dark')}</div></div></section>`}
function studio(){const labels={overview:bi('Vue d’ensemble','Overview'),editor:bi('Édition des contenus','Content editor'),publication:bi('Publication & validations','Publication & approvals'),source:bi('Dossier de référence','Source brief')};return `<div class="wrap"><div class="studio-bar"><div class="eyebrow">JT2J / ${bi('ATELIER ÉDITORIAL','EDITORIAL STUDIO')}</div><p>${bi('Démonstration locale · Aucun compte administrateur ni serveur connecté.','Local demonstration · No administrator account or server connection.')}</p></div><div class="studio-grid"><nav class="studio-nav" aria-label="${bi('Atelier de présentation','Presentation studio')}">${Object.entries(labels).map(([k,v])=>`<button class="studio-tab ${studioTab===k?'active':''}" data-tab="${k}" aria-pressed="${studioTab===k}">${v}</button>`).join('')}</nav><section class="studio-content">${studioTab==='overview'?studioOverview():studioTab==='editor'?studioEditor():studioTab==='publication'?studioPublication():studioSource()}</section></div></div>`}
function studioOverview(){const pages=[['','nav.home'],['company','nav.company'],['expertise','nav.divisions'],['services','nav.services'],['approach','nav.approach'],['faq','nav.faq'],['contact','nav.contact']];return `<h1>${bi('Un site.<br>Six expériences.','One website.<br>Six experiences.')}</h1><p>${bi('Portail institutionnel, cinq pôles et sept fiches de services. Chaque page dispose de son contenu français et anglais. Les parcours sont regroupés dans ce fichier autonome.','Corporate website, five divisions and seven service pages. Each page has French and English content. All journeys are brought together in this self-contained file.')}</p><h2>${bi('Le portail','Corporate website')}</h2>${pages.map(([r,k])=>`<div class="route-row"><a href="${url(r)}">${t(k)} ↗</a><span class="status">FR / EN</span></div>`).join('')}<h2>${t('nav.divisions')}</h2>${D.map(d=>`<div class="route-row"><a href="${url('poles/'+d.slug)}">JT2J ${esc(d.title[lang])} ↗</a><span class="status">FR / EN</span></div>`).join('')}<h2>${t('nav.services')}</h2>${S.map(s=>`<div class="route-row"><a href="${url('services/'+s.slug)}">${esc(s.title[lang])} ↗</a><span class="status">FR / EN</span></div>`).join('')}<div class="preview-help">${bi('Version de présentation : navigation par fragments #/fr et #/en pour fonctionner en ouvrant simplement le fichier HTML. Le référencement public, la réception des messages, l’authentification et l’hébergement relèvent du futur site de production.','Presentation version: fragment navigation via #/fr and #/en allows the HTML file to run when opened directly. Public SEO, request processing, authentication and hosting belong to the future production website.')}</div>`}
function editableEntities(){return [...D.map(d=>({key:'division:'+d.code,label:'JT2J '+d.title[lang],data:d})),...S.map(s=>({key:'service:'+s.slug,label:s.title[lang],data:s})),...Object.entries(P).filter(([k])=>k!=='FAQ').map(([k,p])=>({key:'page:'+k,label:t('nav.'+({HOME:'home',COMPANY:'company',EXPERTISE:'divisions',SERVICES:'services',APPROACH:'approach',CONTACT:'contact'}[k])),data:p}))]}
function studioEditor(){const entities=editableEntities(),e=entities.find(e=>e.key===editKey)||entities[0];editKey=e.key;return `<h1>${bi('Le contenu, entre vos mains.','Content, in your hands.')}</h1><p>${bi('Modifiez les titres et introductions dans les deux langues. Les changements s’appliquent à cette session de présentation. Exportez le contenu pour conserver vos ajustements.','Edit titles and introductions in both languages. Changes apply to this presentation session. Export the content to keep your updates.')}</p><label class="sr-only" for="edit-entity">${bi('Contenu à modifier','Content to edit')}</label><select class="editor-select" id="edit-entity">${entities.map(x=>`<option value="${x.key}" ${x.key===editKey?'selected':''}>${esc(x.label)}</option>`).join('')}</select><div class="edit-columns">${['fr','en'].map(l=>`<div><h3>${l==='fr'?'FRANÇAIS':'ENGLISH'}</h3><div class="field"><label for="edit-title-${l}">${bi('Titre principal','Main title')}</label><textarea id="edit-title-${l}" maxlength="240">${esc(e.data[l].h1)}</textarea></div><div class="field"><label for="edit-lead-${l}">${bi('Introduction','Introduction')}</label><textarea id="edit-lead-${l}" maxlength="2000">${esc(e.data[l].lead)}</textarea></div></div>`).join('')}</div><div class="actions"><button class="btn dark" data-save-edit>${bi('Appliquer à la présentation','Apply to presentation')}${arrow()}</button><button class="btn outline" data-export>${bi('Exporter le contenu','Export content')}${arrow()}</button></div><div class="status-message" id="edit-status" role="status"></div><div class="source-note">${bi('Source éditoriale : dossier JT2J fourni. Les traductions FR/EN doivent conserver le même périmètre factuel. Aucun changement n’est transmis à un serveur.','Editorial source: supplied JT2J brief. French and English translations must retain the same factual scope. No change is sent to a server.')}</div>`}
function studioPublication(){const flags=[['leadership',bi('Direction','Leadership'),bi('Identités, fonctions, mandats et portraits à confirmer.','Identities, positions, appointments and portraits to be confirmed.')],['references',bi('Références','References'),bi('Nature des relations et droits d’utilisation des noms et logos à valider.','Relationships and permission to use names and logos to be approved.')],['legal',bi('Mentions légales','Legal notice'),bi('Informations légales et hébergeur à compléter.','Legal information and hosting provider to be completed.')],['privacy',bi('Confidentialité','Privacy'),bi('Texte à établir à partir des flux de données du futur site.','Policy to be written around the future website’s actual data flows.')],['cookies',bi('Cookies','Cookies'),bi('Paramètres à adapter aux traceurs réellement installés.','Settings to reflect the trackers actually installed.')]];return `<h1>${bi('Prêt à présenter.<br>À valider avant publication.','Ready to present.<br>Approve before launch.')}</h1><p>${bi('Les modules conditionnels sont préparés. Ils restent absents de la navigation publique tant que les validations du dossier ne sont pas acquises.','Conditional modules are prepared. They remain absent from public navigation until the approvals required by the brief are in place.')}</p><div class="studio-flags">${flags.map(([r,title,body])=>`<div class="flag-row"><div><strong>${title} <span class="pill">${bi('NON PUBLIÉ','UNPUBLISHED')}</span></strong>${body}</div><a href="${url(r)}">${bi('Voir l’état','View status')} ↗</a></div>`).join('')}</div><h2>${bi('Formulaire & traitement des demandes','Form & request processing')}</h2><p>${t('form.privacyPending')} ${bi('Le prototype permet la validation locale et un récapitulatif ; aucun message n’est envoyé, aucune référence de réception n’est fabriquée.','This prototype supports local validation and a review summary; no message is sent and no receipt reference is fabricated.')}</p><h2>${bi('Identité visuelle','Visual identity')}</h2><p>${bi('Marque typographique temporaire. Le logo officiel devra remplacer cette signature sans modification de son symbole ni de ses proportions. Les compositions abstraites sont des illustrations décoratives créées en SVG.','Temporary typographic brand. The official logo should replace it without altering its symbol or proportions. The abstract compositions are decorative SVG illustrations.')}</p><div class="source-note">${bi('Les moyens de production prévus dans le dossier — CMS sécurisé, serveur, e-mails transactionnels, sauvegardes et contrôles d’accès — ne sont pas simulés comme des services actifs dans ce prototype.','The production infrastructure specified in the brief — secure CMS, server, transactional email, backups and access controls — is not presented as active services in this prototype.')}</div>`}
function studioSource(){return `<h1>${bi('Une référence commune.','One shared reference.')}</h1><p>${esc(DATA.sourceName)}</p><div class="source-note">${bi('Source de tous les contenus institutionnels : dossier maître JT2J fourni dans cette conversation, fondé sur le Profil d’Entreprise JT2J, pages 1 à 11. Les rattachements de services aux pôles sont éditoriaux. Les informations sensibles restent masquées.','Source for all corporate content: the supplied JT2J master brief, based on the JT2J Company Profile, pages 1–11. Links between services and divisions are editorial. Sensitive information remains hidden.')}</div><div class="actions"><button class="btn dark" data-source-download>${bi('Télécharger le dossier intégré','Download embedded brief')}${arrow()}</button></div><details style="margin-top:30px"><summary style="font-size:13px;cursor:pointer">${bi('Lire le dossier complet','Read the full brief')}</summary><pre class="studio-source">${esc(DATA.source)}</pre></details>`}
function saveFormDraft(){const f=$('#quote-form');if(f){formDraft=Object.fromEntries(new FormData(f));formDraft.consent=$('#consent').checked}}
function getMeta(){let p;if(!route)p=P.HOME;else if(route.startsWith('poles/'))p=D.find(d=>d.slug===route.split('/')[1]);else if(route.startsWith('services/'))p=S.find(s=>s.slug===route.split('/')[1]);else p=P[{company:'COMPANY',expertise:'EXPERTISE',services:'SERVICES',approach:'APPROACH',contact:'CONTACT',faq:'FAQ'}[route]];const m=p?.[lang]?.meta;return {title:m?.[0]||'JT2J Company — '+bi('Prototype de présentation','Presentation prototype'),description:m?.[1]||t('meta.siteDescription')}}
function render(keepScroll=false){saveFormDraft();closeMobile(false);closeMega();const hash=location.hash.replace(/^#\/?/,'');const parts=hash.split('?');let segments=parts[0].split('/').filter(Boolean);if(segments[0]==='fr'||segments[0]==='en')lang=segments.shift();else{try{lang=localStorage.getItem('jt2j-language')==='en'?'en':'fr'}catch{} }route=segments.join('/');params=new URLSearchParams(parts[1]||'');document.documentElement.lang=lang;$('#skip').textContent=bi('Aller au contenu principal','Skip to main content');let content;try{if(!route)content=home();else if(route==='company')content=company();else if(route==='expertise')content=expertise();else if(route==='services')content=services();else if(route==='approach')content=approach();else if(route==='faq')content=faq();else if(route==='contact')content=contact();else if(route==='studio')content=studio();else if(['legal','privacy','cookies'].includes(route))content=legalPage(route);else if(['leadership','references'].includes(route))content=systemPage('pending');else if(route==='request-received')content=systemPage('received');else if(route==='error')content=systemPage('error');else if(route.startsWith('poles/')){let d=D.find(d=>'poles/'+d.slug===route);content=d?division(d):systemPage('missing')}else if(route.startsWith('services/')){let s=S.find(s=>'services/'+s.slug===route);content=s?service(s):systemPage('missing')}else content=systemPage('missing')}catch(e){console.error(e);content=systemPage('error')}header();$('#main').innerHTML='<div class="appear">'+content+'</div>';footer();const meta=getMeta();document.title=meta.title;$('meta[name=description]').content=meta.description;bind();if(!keepScroll)window.scrollTo({top:0,behavior:'instant'});$('#announcer').textContent=meta.title}
function changeLanguage(next){saveFormDraft();lang=next;try{localStorage.setItem('jt2j-language',lang)}catch{}const qp=new URLSearchParams(params);if(route==='contact'){for(const k of ['division','service','intent']){if(formDraft[k])qp.set(k,formDraft[k]);else qp.delete(k)}}const q=qp.toString();location.hash='/'+lang+(route?'/'+route:'')+(q?'?'+q:'')}
function closeMega(){const m=$('#mega-menu'),b=$('.mega-toggle');if(m)m.hidden=true;if(b)b.setAttribute('aria-expanded','false')}
function openMobile(){previousFocus=document.activeElement;const m=$('#mobile-menu');m.innerHTML=`<div class="mobile-top">${brand()}<button class="close-btn" data-close-menu aria-label="${esc(t('nav.close'))}">${icon('close')}</button></div><nav class="mobile-links">${[['','nav.home'],['company','nav.company'],['expertise','nav.divisions'],['services','nav.services'],['approach','nav.approach'],['contact','nav.contact']].map(([r,k])=>`<a href="${url(r)}">${t(k)}${arrow()}</a>`).join('')}</nav><div class="mobile-divisions">${D.map(d=>`<a href="${url('poles/'+d.slug)}">0${d.order} — ${esc(d.title[lang])}</a>`).join('')}</div><div class="mobile-bottom">${localeSwitch()}${btn(t('cta.quote'),quoteLink())}</div>`;m.hidden=false;document.body.classList.add('locked');$('.menu-button').setAttribute('aria-expanded','true');m.querySelector('[data-close-menu]').onclick=()=>closeMobile();m.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>changeLanguage(b.dataset.lang));m.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>closeMobile(false)));m.querySelector('[data-close-menu]').focus()}
function closeMobile(restore=true){const m=$('#mobile-menu');if(!m||m.hidden)return;m.hidden=true;document.body.classList.remove('locked');$('.menu-button')?.setAttribute('aria-expanded','false');if(restore)previousFocus?.focus()}
function bind(){document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>changeLanguage(b.dataset.lang));$('.mega-toggle')?.addEventListener('click',()=>{const m=$('#mega-menu'),open=m.hidden;m.hidden=!open;$('.mega-toggle').setAttribute('aria-expanded',String(open))});$('.menu-button')?.addEventListener('click',openMobile);$('[data-studio]')?.addEventListener('click',()=>location.hash=url('studio'));$$('[data-art]').forEach(a=>{const update=()=>{const el=$('#division-preview');if(el){let d=D.find(d=>d.code===a.dataset.art);el.innerHTML=artwork(d.code)+`<span class="art-name"><span>${esc(d.title[lang])}</span><span>0${d.order} / 05</span></span>`}};a.addEventListener('mouseenter',update);a.addEventListener('focus',update)});$$('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$$('[data-filter]').forEach(x=>{x.classList.toggle('active',x.dataset.filter===filter);x.setAttribute('aria-pressed',String(x.dataset.filter===filter))});$('#service-results').innerHTML=filteredServices()});$('#service-search')?.addEventListener('input',e=>{search=e.target.value;$('#service-results').innerHTML=filteredServices()});$('#quote-form')?.addEventListener('submit',reviewForm);$('#division')?.addEventListener('change',e=>{let d=e.target.value;let current=$('#service').value;$('#service').innerHTML=[['',t('form.service.none')],...S.filter(s=>!d||s.division===d).map(s=>[s.slug,s.title[lang]])].map(([v,l])=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(l)}</option>`).join('')});$('#service')?.addEventListener('change',e=>{let s=S.find(s=>s.slug===e.target.value);if(s)$('#division').value=s.division});$$('[data-tab]').forEach(b=>b.onclick=()=>{studioTab=b.dataset.tab;render(true)});$('#edit-entity')?.addEventListener('change',e=>{editKey=e.target.value;render(true)});$('[data-save-edit]')?.addEventListener('click',()=>{const e=editableEntities().find(e=>e.key===editKey);if(!['fr','en'].every(l=>$('#edit-title-'+l).value.trim()&&$('#edit-lead-'+l).value.trim())){$('#edit-status').textContent=bi('Complétez les deux langues avant d’appliquer.','Complete both languages before applying.');return}['fr','en'].forEach(l=>{e.data[l].h1=$('#edit-title-'+l).value.trim();e.data[l].lead=$('#edit-lead-'+l).value.trim()});$('#edit-status').textContent=bi('Modifications appliquées à cette session. Exportez le contenu pour les conserver.','Changes applied to this session. Export the content to keep them.')});$('[data-export]')?.addEventListener('click',()=>download(JSON.stringify(DATA,null,2),'JT2J_Contenus_FR_EN.json','application/json'));$('[data-source-download]')?.addEventListener('click',()=>download(DATA.source,'JT2J_SITE_WEB_MASTER_BLUEPRINT_FR_EN_V1.md','text/markdown'));}
function reviewForm(e){e.preventDefault();saveFormDraft();const f=e.target;let errors=[];$$('.field .error').forEach(el=>el.textContent='');f.querySelectorAll('[aria-invalid]').forEach(el=>el.removeAttribute('aria-invalid'));const fail=(name,msg)=>{errors.push(name);$('#'+name).setAttribute('aria-invalid','true');$('#error-'+name).textContent=msg};if(!String(formDraft.fullName||'').trim())fail('fullName',t('form.required'));if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(formDraft.email||'').trim()))fail('email',t('form.invalidEmail'));if(formDraft.phone&&!/^\+?[\d\s().-]{6,25}$/.test(formDraft.phone))fail('phone',t('form.invalidPhone'));if(String(formDraft.message||'').trim().length<15)fail('message',t('form.messageTooShort'));if(!formDraft.consent){errors.push('consent');$('#form-error').textContent=bi('Confirmez que vous avez compris le mode démonstration.','Please confirm that you understand the demonstration mode.')}else $('#form-error').textContent='';if(formDraft.website)return;if(errors.length){$('#'+errors[0]).focus();return}const div=D.find(d=>d.code===formDraft.division),srv=S.find(s=>s.slug===formDraft.service);const rows=[['form.fullName',formDraft.fullName],['form.organization',formDraft.organization],['form.email',formDraft.email],['form.phone',formDraft.phone],['form.city',formDraft.city],['form.intent',t('form.intent.'+formDraft.intent)],['form.division',div?.title[lang]],['form.service',srv?.title[lang]]].filter(x=>x[1]);const subject='JT2J — '+t('form.intent.'+formDraft.intent)+(srv?' — '+srv.title[lang]:'');const body=rows.map(([k,v])=>t(k)+': '+v).join('\n')+'\n\n'+formDraft.message;const mailto='mailto:info@jt2j.com?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);const dialog=$('#review-dialog');dialog.innerHTML=`<div class="modal-inner"><div class="modal-head"><h2 id="review-title">${bi('Votre demande,<br>en un regard.','Your enquiry,<br>at a glance.')}</h2><button type="button" class="close-btn" data-close-review aria-label="${bi('Fermer le récapitulatif','Close review')}">${icon('close')}</button></div><div class="demo-info">${bi('Récapitulatif de démonstration — aucune demande envoyée.','Demonstration review — no request has been sent.')}</div>${rows.map(([k,v])=>`<div class="review-row"><span>${t(k)}</span><span>${esc(v)}</span></div>`).join('')}<div class="review-row message"><span>${t('form.message')}</span>${esc(formDraft.message)}</div><p class="modal-status">${bi('Le bouton ci-dessous ouvre votre application e-mail avec un brouillon prérempli. Vous déciderez de l’envoyer depuis cette application.','The button below opens your email app with a prefilled draft. You choose whether to send it from that app.')}</p><div class="actions">${btn(bi('Préparer un e-mail','Prepare an email'),mailto,'dark')}<button class="btn outline" type="button" data-close-review>${bi('Modifier','Edit')}</button></div></div>`;dialog.querySelectorAll('[data-close-review]').forEach(b=>b.onclick=()=>dialog.close());dialog.showModal()}
function download(content,name,mime){const blob=new Blob([content],{type:mime+';charset=utf-8'}),a=document.createElement('a');const u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMega();closeMobile()}const m=$('#mobile-menu');if(e.key==='Tab'&&!m.hidden){const items=[...m.querySelectorAll('a,button,input,select')].filter(x=>!x.disabled),first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.addEventListener('click',e=>{if(!$('#header').contains(e.target))closeMega();const anchor=e.target.closest('a');if(anchor){const href=anchor.getAttribute('href');if(href?.startsWith('#')&&!href.startsWith('#/')){const target=$(href);if(target){e.preventDefault();target.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});if(href==='#main')target.focus({preventScroll:true})}}}});
window.addEventListener('hashchange',()=>{render();$('#main').focus({preventScroll:true})});
render();
</script>
