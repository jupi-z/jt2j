ility and intervention arrangements are to be confirmed when making an enquiry."}]}}, "CONTACT": {"fr": {"meta": ["Contacter JT2J Company | Lubumbashi et Kolwezi", "Contactez JT2J Company par téléphone, par e-mail ou via notre formulaire de demande."], "h1": "Parlons de votre besoin.", "lead": "Vous avez une question, un projet ou une demande de prestation ? Adressez-vous à JT2J Company."}, "en": {"meta": ["Contact JT2J Company | Lubumbashi and Kolwezi", "Contact JT2J Company by phone, email or through our enquiry form."], "h1": "Let's discuss your needs.", "lead": "Have a question, a project or a service enquiry? Get in touch with JT2J Company."}}, "FAQ": {"fr": {"meta": ["Questions fréquentes | JT2J Company", "Retrouvez les réponses aux principales questions sur les activités et les contacts de JT2J."], "h1": "Vos questions, nos premières réponses.", "lead": "", "items": [["Que fait JT2J Company ?", "JT2J Company présente une offre multiservices structurée autour de cinq pôles : Sécurité & Biométrie, Logistique & Tracking, Hygiène & Extermination, Business & Marketing et Voyages & Évasion."], ["Où JT2J Company est-elle implantée ?", "Son profil d'entreprise mentionne Lubumbashi et Kolwezi, en République démocratique du Congo."], ["Comment demander une prestation ?", "Vous pouvez présenter votre besoin dans le formulaire de contact, lorsqu'il est disponible, ou écrire à info@jt2j.com."], ["Quels services sont présentés dans le profil JT2J ?", "La liste comprend notamment la lutte contre les nuisibles, le nettoyage, les voyages, la désinfection, la gestion des installations, le transport et la fourniture de produits et matériels."], ["Peut-on obtenir un devis personnalisé ?", "Vous pouvez adresser une demande de devis en précisant la prestation souhaitée et les informations utiles. Les modalités de réponse seront convenues directement avec JT2J."], ["Comment contacter JT2J Company ?", "Par e-mail à info@jt2j.com ou par téléphone au +243974004510."]]}, "en": {"meta": ["Frequently Asked Questions | JT2J Company", "Find answers to common questions about JT2J's activities and contact options."], "h1": "Your questions, our first answers.", "lead": "", "items": [["What does JT2J Company do?", "JT2J Company presents a multiservice offering organised around five divisions: Security & Biometrics, Logistics & Tracking, Hygiene & Pest Control, Business & Marketing, and Travel & Escapes."], ["Where is JT2J Company based?", "Its company profile mentions Lubumbashi and Kolwezi in the Democratic Republic of the Congo."], ["How do I enquire about a service?", "You can describe your needs through the contact form, when available, or email info@jt2j.com."], ["Which services are listed in JT2J's profile?", "The profile lists pest control, cleaning, travel services, disinfection, facility management, transport, and the supply of products and equipment."], ["Can I request a tailored quote?", "You can submit a quote request explaining the service you need and the relevant details. JT2J will discuss the next steps with you directly."], ["How can I contact JT2J Company?", "By email at info@jt2j.com or by phone at +243974004510."]]}}}, "sourceName": "JT2J_SITE_WEB_MASTER_BLUEPRINT_FR_EN_V1 (1).md", "source": "# JT2J COMPANY — DOSSIER MAÎTRE DE CONCEPTION ET DE RÉALISATION WEB\n\n**Site institutionnel + cinq mini-sites spécialisés | Français / English | Version 1.0**  \n**Date de rédaction : 26 octobre 2026**  \n**État : dossier de conception et de contenu prêt à transmettre à une équipe de réalisation ; publication subordonnée aux validations signalées**  \n**Document source unique sur l'entreprise : _Profil d'Entreprise JT2J_, PDF de 11 pages communiqué pour le projet.**\n\n> **Instruction au réalisateur :** ce fichier est le cahier des charges de référence. Il contient l'architecture, les contenus bilingues, les interfaces attendues, le fonctionnement technique et les critères d'acceptation. Il faut **implémenter**, et non réécrire librement, les contenus approuvés. Toute information non attestée est identifiable par le statut décrit ci-dessous. Ne jamais transformer une hypothèse de conception en fait public.\n\n---\n\n## 0. Mode d'emploi, niveau de preuve et règles impératives\n\n### 0.1 Légende des statuts\n\n| Statut | Signification | Usage en production |\n|---|---|---|\n| **[S] Source JT2J** | Information présente dans le PDF ; elle reste une déclaration de JT2J et non une vérification indépendante. | Publiable comme communication fournie par le client, sauf mention sensible nécessitant autorisation ou vérification. |\n| **[E] Éditorial proposé** | Texte, regroupement ou décision UX déduit du périmètre, sans fait nouveau. | Publiable après relecture éditoriale générale ; aucune capacité inventée. |\n| **[T] Technique recommandé** | Choix de réalisation, d'architecture, de sécurité ou d'interface. | À exécuter sauf contrainte technique argumentée. |\n| **[V] Vérification / validation préalable** | Information sensible, inconnue, incohérente ou soumise à droit d'usage. | Ne pas rendre publique avant validation explicite ; masquer proprement la section si nécessaire. |\n| **[P] Prévu mais désactivé** | Module modélisé pour évolution future mais non nécessaire au lancement. | Ne pas présenter comme service disponible. |\n\n**Règles non négociables :**\n\n1. Le PDF fourni est **l'unique référence factuelle JT2J** pour cette version. Aucune consultation de registre, de client ou de fournisseur n'a été effectuée dans ce dossier.\n2. Les **cinq noms de pôles** sont repris tels quels de la couverture [S, p. 1]. Les **sept secteurs listés** sont repris de la page 6 [S, p. 6]. Leur regroupement est une **taxonomie de navigation [E]**, **pas** une affirmation juridique ou organisationnelle.\n3. Ne pas inventer : année de création, adresse postale, RCCM, NIF, effectifs, chiffres d'affaires, tarifs, délais garantis, certifications, homologations, avis, missions clients, photographies, coordonnées de bureaux, moyens matériels, agréments, partenaires ou présence légale au Canada.\n4. Ne pas présenter des produits, services ou fonctionnalités absent(e)s du profil comme opérationnel(le)s. Les mentions « biométrie », « tracking » et « marketing » désignent des **pôles**, mais la page 6 ne décrit pas de catalogue détaillé dans ces trois domaines.\n5. Les slogans, promesses, normes ou références sensibles existant dans le PDF ne sont **pas automatiquement vérifiés**. Le site peut les présenter avec prudence, ou les retenir jusqu'à validation (§ 4 et § 16).\n6. **FR et EN doivent être complets**, avec contenu naturel, navigation, métadonnées, messages de formulaires, textes alternatifs, accessibilité et pages système traduits. L'anglais est une **traduction éditoriale proposée**, non une traduction juridiquement certifiée.\n7. Aucun « lorem ipsum », faux témoignage, pseudo-logo de partenaire, faux compteur animé, fausse vidéo d'équipe ou image IA présentée comme une photographie documentaire.\n8. **Le site doit être livrable sans réponse supplémentaire de JT2J** pour la phase de construction : masquer les informations non confirmées, utiliser des contenus prudents, et concentrer les demandes de validation sur un petit nombre de points avant mise en ligne.\n9. Conserver exactement le symbole et les proportions du logo officiel si un fichier authentique est fourni ; à défaut afficher une marque typographique « JT2J COMPANY » **temporaire**, sans reconstituer l'aigle par imagination.\n10. Ne jamais publier une politique de confidentialité ou des mentions légales fictives. Ces pages ont des gabarits livrables mais leurs champs légaux doivent être validés.\n\n### 0.2 Ce que dit effectivement le PDF\n\n| Page | Information disponible |\n|---|---|\n| 1 | Logo JT2J Company avec aigle doré ; cinq pôles ; slogan « JT2J l'innovation pour tous vos besoins ». |\n| 2 | Sommaire institutionnel, sans inventaire complet des pages web futures. |\n| 3 | JT2J se présente comme un groupe multiservices à Lub  accessible au clavier, respect de la réduction des animations, FR/EN sans contenu manquant.\n\n---\n\n## 1. Vision du produit et périmètre contractuel\n\n### 1.1 Objet\n\nConcevoir et construire une présence numérique cohérente qui permette de :\n\n1. identifier clairement JT2J Company, son implantation déclarée et sa vocation multiservices ;\n2. comprendre l'offre réellement documentée de chaque pôle ;\n3. explorer les sept secteurs d'intervention ;\n4. découvrir mission, vision, valeurs et engagement de service ;\n5. contacter JT2J ou soumettre une demande contextualisée ;\n6. naviguer en français ou en anglais sans rupture de contexte ;\n7. administrer les contenus sans intervenir directement dans le code.\n\n### 1.2 Publics cibles — personas de **conception**, pas clientèle attestée\n\n- **Responsable d'entreprise** : comprendre la pertinence d'un service, sa zone d'intervention et solliciter une proposition.\n- **Particulier** : découvrir les offres accessibles et contacter JT2J facilement.\n- **Responsable achats/exploitation** : naviguer rapidement vers les services logistiques, d'hygiène ou de fourniture et établir un premier contact.\n- **Partenaire potentiel** : connaître la structure, les valeurs et les contacts officiels.\n- **Visiteur anglophone** : accéder au même niveau d'information qu'en français.\n\nNe pas afficher sur le site les libellés de ces personas comme une liste de segments JT2J validés.\n\n### 1.3 Hors périmètre V1\n\n- E-commerce et panier, facturation et paiements, réservation confirmée en temps réel ;\n- compte client, authentification de clients finaux, espace abonnés ;\n- télésurveillance, visualisation réelle de flotte, traçabilité GPS, données biométriques ;\n- plateforme de voyages et émission de billets ;\n- ERP, CRM complexe, intégrations à des prestataires non validés ;\n- publication de faux indicateurs et de logos tiers non autorisés.\n\nL'architecture doit pouvoir évoluer vers ces usages, **sans les simuler** au lancement.\n\n---\n\n## 2. Architecture de l'information — toutes les routes V1\n\n**Principe :** deux langues sur chaque route ; les segments techniques demeurent stables pour simplifier la production. Le préfixe localisé est obligatoire. Les libellés visibles, eux, sont intégralement traduits.\n\n### 2.1 Racine et pages institutionnelles\n\n| ID | Français | English | Fonction |\n|---|---|---|---|\n| `HOME` | `/fr` | `/en` | Accueil JT2J Company. |\n| `COMPANY` | `/fr/company` | `/en/company` | À propos, mission, vision, valeurs, organisation. |\n| `EXPERTISE` | `/fr/expertise` | `/en/expertise` | Présentation des cinq pôles. |\n| `SERVICES` | `/fr/services` | `/en/services` | Index des sept services décrits dans le PDF. |\n| `APPROACH` | `/fr/approach` | `/en/approach` | Engagements et approche de service, texte prudent. |\n| `LEADERSHIP` | `/fr/leadership` | `/en/leadership` | Direction, **conditionnelle [V]**. |\n| `REFERENCES` | `/fr/references` | `/en/references` | Références, **conditionnelles [V]**. |\n| `CONTACT` | `/fr/contact` | `/en/contact` | Coordonnées + formulaire de contact général. |\n| `FAQ` | `/fr/faq` | `/en/faq` | Questions-réponses factuelles et aide aux démarches. |\n| `LEGAL` | `/fr/legal` | `/en/legal` | Mentions légales : contenu officiel à fournir avant publication. |\n| `PRIVACY` | `/fr/privacy` | `/en/privacy` | Confidentialité : texte juridique à établir après inventaire réel des données. |\n| `COOKIES` | `/fr/cookies` | `/en/cookies` | Cookies : configuration et politique conformes à la réalité du site. |\n| `NOT_FOUND` | 404 localisée | 404 localized | Page inexistante. |\n| `ERROR` | Page d'erreur locale | Localized error page | Reprise en cas d'erreur. |\n| `THANK_YOU` | `/fr/request-received` | `/en/request-received` | Confirmation suite à une demande **réellement enregistrée**. |\n\n### 2.2 Mini-sites des cinq pôles\n\n| Code | Pôle officiel affiché FR | Appellation EN proposée | Accueil du mini-site | Sous-pages |\n|---|---|---|---|---|\n| `SEC` | JT2J Sécurité & Biométrie | JT2J Security & Biometrics | `/[locale]/poles/security-biometrics` | Overview, Contact contextualisé ; détail des offres uniquement après confirmation. |\n| `LOG` | JT2J Logistique & Tracking | JT2J Logistics & Tracking | `/[locale]/poles/logistics-tracking` | Overview, Transport & Logistics, Contact contextualisé. |\n| `HYG` | JT2J Hygiène & Extermination | JT2J Hygiene & Pest Control | `/[locale]/poles/hygiene-pest-control` | Overview, Pest Control, Cleaning, Disinfection, Facility Management (entretien seulement), Contact. |\n| `BIZ` | JT2J Business & Marketing | JT2J Business & Marketing | `/[locale]/poles/business-marketing` | Overview, General Trading & Supply, Contact contextualisé. |\n| `TRV` | JT2J Voyages & Évasion | JT2J Travel & Escapes | `/[locale]/poles/travel-escapes` | Overview, Travel & Tourism, Contact contextualisé. |\n\n**Route service canonique indépendante du pôle** : `/[locale]/services/[slug]`. La présence d'un service dans un mini-site est assurée par une carte ou un lien vers sa route canonique et le code du pôle dans le formulaire. Ne dupliquer ni les textes ni les pages SEO.\n\n### 2.3 Sept services et rattachements proposés [E]\n\n| Slug stable | Libellé du PDF [S] | Pôle de navigation proposé [E] | Réserve |\n|---|---|---|---|\n| `pest-control` | Pest Control & Extermination | HYG | Rattachement cohérent avec le nom du pôle. |\n| `cleaning` | Cleaning Services | HYG | Rattachement éditorial. |\n| `travel-tourism` | Travel & Tourism | TRV | Rattachement cohérent. |\n| `disinfection-sanitation` | Disinfection & Sanitation | HYG | Rattachement éditorial. |\n| `facility-management` | Facility Management | HYG | **Rattachement seulement provisoire** ; ce secteur couvre plus largement la gestion des bâtiments. Pas réduire l'offre à la seule hygiène. |\n| `transport-logistics` | Transport & Logistics | LOG | Rattachement cohérent. |\n| `trading-supply` | General Trading & Supply | BIZ | **Rattachement provisoire**, pas de preuve d'une structure commerciale distincte. |\n\nLes pôles **Sécurité & Biométrie**, **Logistique & Tracking**, **Business & Marketing** et **Voyages & Évasion** ne justifient **pas**, à eux seuls, de créer des pages « vidéosurveillance », « suivi GPS », « création de sites », « billetterie » ou autres services non listés : seul le nom du pôle existe dans le PDF pour ces spécialités.\n\n### 2.4 Navigation globale\n\n**Menu principal FR :** Accueil | L'entreprise | Nos pôles [menu] | Services | Notre approche | Contact.  \n**Menu principal EN :** Home | Company | Our Divisions [menu] | Services | Our Approach | Contact.\n\n- Sous-menu des pôles : cinq intitulés ; description courte ; icône abstraite non trompeuse.\n- Header : logo officiel s'il est fourni ; bouton de changement FR/EN ; CTA « Demander un devis » / « Request a quote » vers contact avec `intent=quote`.\n- Navigation mobile : bouton accessible « Ouvrir le menu » / « Open menu », tiroir pleine hauteur, fermeture par Escape et après navigation, focus maîtrisé.\n- En-tête secondaire mini-site : lien retour JT2J Company, nom du pôle, accès à ses sections et bouton de contact.\n- Breadcrumb pour toute page de profondeur > 1 ; ne pas afficher sur l'accueil.\n- Footer commun : cinq pôles, services clés, entreprise, contact, sélection linguistique, pages légales uniquement si prêtes.\n- Page Direction / Références : **liens masqués** tant que les conditions [V] ne sont pas satisfaites.\n\n---\n\n## 3. Design system — règles exécutables\n\n### 3.1 Direction artistique\n\n**Intention :** haute gamme, clarté, calme, confiance, finition technique. Éviter les interfaces chargées, les cartes systématiques, les ombres artificielles et les animations sans fonction.\n\nPalette **provisoire extraite visuellement de la présentation**, non charte officielle :\n\n| Token | Valeur illustrative | Usage |\n|---|---|---|\n| `--navy-950` | `#05122C` | Fonds de hero, footer, surfaces sombres. |\n| `--navy-800` | `#0B2D58` | Sections secondaires. |\n| `--blue-500` | `#1686BB` | Accents, lignes, états interactifs (contraste à vérifier). |\n| `--gold-500` | `#C59A45` | Accent de marque discret ; ne pas l'utiliser seul pour des petits textes sans contrôle de contraste. |\n| `--ink-950` | `#111827` | Texte sur fond clair. |\n| `--paper` | `#FFFFFF` | Surface principale. |\n| `--mist` | `#F3F6F9` | Grandes sections alternées. |\n\n**Ces codes HEX sont des propositions et ne prétendent pas être la palette officielle.** Substituer les valeurs de marque authentifiées lorsqu'elles sont disponibles.\n\n### 3.2 Typographie et mise en page\n\n- Police de titrage contemporaine à forte personnalité, police de lecture sans-serif fiable ; licences vérifiées ; deux graisses utiles maximum par usage.\n- Corp de texte desktop 16–18 px, interligne 1.55–1.75 ; minimum raisonnable mobile 16 px.\n- Titres responsives via `clamp()`, sans découpage qui compromet la lecture en français/anglais.\n- Grille maximale de contenu : 1200–1320 px environ ; larges respirations, densité modérée.\n- Sections alternées sans « cartes » décoratives omniprésentes ; préférer grands blocs éditoriaux, filets et panneaux discrets.\n- Pas d'images stock présentées comme photographies du personnel ou de projets de JT2J.\n- Ne pas surcharger la page de dégradés et du motif de vagues issu du PDF. Réserver les motifs à des zones soigneusement limitées.\n\n### 3.3 Signature par pôle\n\n| Pôle | Variation proposée (sans création de sous-logo) | Sujet d'illustration permis |\n|---|---|---|\n| SEC | Bleu nuit, tracés géométriques fins | Sécurité abstraite, interfaces fictives **clairement décoratives**, sans fausse installation. |\n| LOG | Bleu profond, lignes de parcours abstraites | Réseaux, itinéraires abstraits, transports génériques non présentés comme flotte JT2J. |\n| HYG | Blanc lumineux, bleu, accent vert très discret | Environnements entretenus génériques licenciés, sans revendiquer l'intervention de JT2J. |\n| BIZ | Fond clair, noir bleuté, accent or contrôlé | Formes éditoriales, stratégie commerciale, ressources professionnelles génériques. |\n| TRV | Espaces ouverts, ciel/bleu, grandes photographies de destination | Paysages **non légendés comme destinations effectivement vendues**. |\n\n### 3.4 Composants à développer\n\n`GlobalHeader`, `DivisionHeader`, `MobileNav`, `LanguageSwitcher`, `Breadcrumb`, `HeroEditorial`, `HeroDivision`, `IntroStatement`, `DivisionIndex`, `ServiceList`, `ServiceDetail`, `ValueList`, `PromiseList`, `EvidenceGallery` [conditionnel], `LeadershipRoster` [conditionnel], `ReferenceStrip` [conditionnel], `RelatedServices`, `ContactPanel`, `QuoteForm`, `AccordionFAQ`, `Footer`, `CookiePreferences` [si cookies optionnels], `InlineStatus`, `ErrorState`, `Skeleton`, `SkipLink`, `SeoHead`, `StructuredData`.\n\n### 3.5 Animation et interaction\n\n- Menu doux < 300 ms, transition non intrusive ; indicateur actif.\n- Entrées des sections par léger fondu/déplacement **désactivées** si `prefers-reduced-motion: reduce`.\n- Aucune animation bloquant le scroll, aucun son automatique, aucune vidéo automatique avec audio.\n- Éviter les vues 3D lourdes et les effets qui ralentissent les téléphones.\n- États clavier/focus visibles en modes clair et sombre. Les formulaires exposent erreurs et succès aux lecteurs d'écran.\n\n---\n\n## 4. Registre des faits sensibles et stratégie de publication\n\n| Élément | Constat PDF | Décision de lancement |\n|---|---|---|\n| Nom « JT2J Company » | Présent partout [S]. | Afficher comme nom de communication. Ne pas spécifier SARL/SAS sans justificatif. |\n| Lubumbashi et Kolwezi, RDC | Mentionnés p. 3 [S]. | Afficher « présentée comme implantée à Lubumbashi et Kolwezi » dans les métadonnées internes ; sur le site « À Lubumbashi et Kolwezi » comme déclaration client. Ne pas inventer de rue. |\n| CEO Taylor Muanza | p. 3 [S]. | Éviter sur l'accueil tant que la fiche dirigeant n'est pas validée ; page équipe conditionnelle. |\n| DG Canada | p. 8 [S]. | Ne pas afficher « bureau canadien », « société canadienne », ni carte du Canada sans preuves. |\n| MYM Advisor | p. 8, associé à Finance, Comptabilité, RH [S]. | Ne pas le présenter comme filiale ; rôle et relation à confirmer avant affichage. |\n| « Standards Nord-Américains » | Revendiqué p. 7 [S]. | Retenir tant que la portée exacte et les preuves ne sont pas précisées ; ne pas transformer en certification. |\n| Produits certifiés internationalement | Revendiqué p. 7 [S]. | Ne pas afficher de badges ou prétendre des certifications sans références. |\n| Contrats avec suivi mensuel | Revendiqué p. 7 [S]. | Ne pas généraliser à toutes les offres ; mention seulement si contrat applicable confirmé. |\n| Interventions jour/nuit | p. 7 [S]. | Dire « modalités d'intervention adaptées au contexte du client » [E], sans promesse 24h/24 ou 7j/7. |\n| Cinq références p. 9 | Logos et noms visibles [S]. | Composant conditionnel non publié sans autorisation et nature de relation documentée. |\n| `info@jt2j.com` | p. 11 [S]. | Afficher ; `mailto:info@jt2j.com`. Livrabilité à tester avant mise en ligne. |\n| `+243974004510` | p. 11 [S]. | Afficher ; `tel:+243974004510`. Ne pas supposer que ce numéro est WhatsApp. |\n| `@jt2jcompany` | p. 11 [S]. | Afficher en texte ; liens sociaux absents tant que les URLs exactes ne sont pas confirmées. |\n| Visuels p. 10 | Supports promotionnels [S]. | Ne pas extraire/publier comme portfolio sans fichiers et autorisations. |\n\n---\n\n## 5. Texte global et microcopy — bilingue, à intégrer intégralement\n\n### 5.1 Identité et navigation\n\n| Clé i18n | Français | English |\n|---|---|---|\n| `brand.name` | JT2J Company | JT2J Company |\n| `brand.tagline` | L'innovation pour tous vos besoins. | Innovation for all your needs. |\n| `nav.home` | Accueil | Home |\n| `nav.company` | L'entreprise | Company |\n| `nav.divisions` | Nos pôles | Our divisions |\n| `nav.services` | Services | Services |\n| `nav.approach` | Notre approche | Our onnées exigées avant rendu : `officialName`, `authorizedLogoFile`, `relationshipType`, `servicePerformed`, `permissionStatus`, `approvedForPublication`. Si une seule des permissions fait défaut, omettre le logo et la description concernés. Ne jamais appeler « client » ou « partenaire » une organisation sans preuve de la nature de la relation.\n\n**Fallback :** masquer route + lien, ne pas afficher « Ils nous font confiance » sur l'accueil.\n\n### PAGE `THANK_YOU` — confirmation réelle\n\n**FR title** `Merci, votre demande a bien été reçue.`  \n**FR body** `Votre message a été enregistré. Vous pouvez conserver la référence affichée pour vos échanges avec JT2J Company.`  \n**FR link** `Retourner à l'accueil`.\n\n**EN title** `Thank you. Your request has been received.`  \n**EN body** `Your message has been recorded. You can keep the displayed reference for your conversations with JT2J Company.`  \n**EN link** `Return to home`.\n\nNe jamais rendre cette page accessible comme preuve de soumission par simple navigation directe non authentifiée. Utiliser un jeton de confirmation temporaire, un état serveur validé, ou afficher le succès dans le formulaire et retourner à l'accueil.\n\n### Pages d'erreur et états généraux\n\n| Élément | Français | English |\n|---|---|---|\n| 404 titre | Cette page n'existe pas. | This page doesn't exist. |\n| 404 description | Le lien est peut-être incorrect ou la page a été déplacée. | The link may be incorrect or the page may have moved. |\n| 404 CTA | Retour à l'accueil | Back to home |\n| 500 titre | Une erreur est survenue. | Something went wrong. |\n| 500 texte | Nous ne pouvons pas afficher cette page pour le moment. | We can't display this page right now. |\n| Recherche vide | Aucun résultat pour le moment. | No results at the moment. |\n| Donnée indisponible | Information non disponible. | Information unavailable. |\n| Chargement | Chargement en cours… | Loading… |\n\n---\n\n## 7. Contenus complets — cinq mini-sites\n\n> Les intitul ervices index | Intro, 7 services, CTA | Filtre par pôle après validation |\n| Service detail | Hero, périmètre source, informations à fournir, CTA, services associés | Photos clients autorisées |\n| Approach | 4 thèmes prudents, CTA | Accréditations documentées |\n| Contact | Coordonnées, choix de pôle, formulaire si autorisé, canal alternatif | Carte avec adresse exacte confirmée |\n| FAQ | 6 Q/R, CTA | Questions propres aux pôles après source validée |\n| Leadership | H1, fiches nominatives vérifiées | Portraits, biographies autorisées |\n| References | Logos autorisés, relations qualifiées | Études de cas approuvées |\n| Legal/privacy/cookies | Textes juridiquement validés | Préférences de cookies si nécessaires |\n| Error/404 | Message, retour | Recherche interne ultérieure |\n\n---\n\n## 10. Spécification technique de référence [T]\n\n### 10.1 Stack et architecture\n\n**Proposition de base** :\n\n- **Next.js App Router + TypeScript**, rendu serveur/SSG-ISR adapté aux contenus publics.\n- React pour la composition des composants ; CSS natif moderne ou Tailwind CSS, selon maîtrise de l'équipe, en conservant les mêmes tokens de design.\n- Dictionnaires typés `fr` et `en` pour les textes de l'interface ; contenus éditoriaux structurés par locale dans le CMS ou dans des fichiers versionnés pour le démarrage.\n- Base SQL **PostgreSQL** seulement si administration éditoriale, demandes ou audit requièrent une persistance centralisée ; ne pas imposer une base si le site reste purement statique sans formulaires.\n- Administration **headless** : interface interne sécurisée permettant de gérer pages, services, références, médias, statut de publication et traductions. Solutions possibles : CMS open source correctement maintenu ou back-office sur mesure. Aucune dépendance à un fournisseur n'est imposée par le PDF.\n- E-mail transactionnel via service autorisé et domaine correctement configuré ; traitement des demandes côté serveur.\n- Médias dans un espace sécurisé, fichiers publics optimisés et distribués via l'hébergement retenu ; aucune obligation de CDN externe.\n- Déploiement automatisé staging → production ; sauvegardes si stockage persistant ; accès techniques individuels et secrets hors dépôt.\n\n**Règle de proportionnalité** : le besoin V1 reste un **site corporate + mini-sites**, pas un ERP. Favoriser le moins de complexité possible compatible avec la maintenance et les besoins éditoriaux.\n\n### 10.2 Structure de dépôt suggérée\n\n```text\njt2j-web/\n├── README.md\n├── docs/\n│   ├── JT2J_SITE_WEB_MASTER_BLUEPRINT_FR_EN_V1.md\n│   ├── architecture.md\n│   ├── content-sources.md\n│   ├── release-checklist.md\n│   └── runbook.md\n├── public/\n│   ├── brand/                 # uniquement logo authentique\n│   ├── imagery/               # licences/permissions documentées\n│   └── icons/\n├── src/\n│   ├── app/\n│   │   ├── [locale]/\n│   │   │   ├── layout.tsx\n│   │   │   ├── page.tsx\n│   │   │   ├── company/page.tsx\n│   │   │   ├── expertise/page.tsx\n│   │   │   ├── approach/page.tsx\n│   │   │   ├── faq/page.tsx\n│   │   │   ├── contact/page.tsx\n│   │   │   ├── services/page.tsx\n│   │   │   ├── services/[slug]/page.tsx\n│   │   │   ├── poles/[slug]/page.tsx\n│   │   │   ├── leadership/page.tsx\n│   │   │   ├── references/page.tsx\n│   │   │   ├── legal/page.tsx\n│   │   │   ├── privacy/page.tsx\n│   │   │   └── cookies/page.tsx\n│   │   ├── api/\n│   │   │   └── inquiries/route.ts\n│   │   └── sitemap.ts\n│   ├── components/\n│   │   ├── global/\n│   │   ├── editorial/\n│   │   ├── forms/\n│   │   └── a11y/\n│   ├── config/\n│   │   ├── routes.ts\n│   │   ├── feature-flags.ts\n│   │   ├── divisions.ts\n│   │   └── services.ts\n│   ├── content/\n│   │   ├── fr/\n│   │   └── en/\n│   ├── i18n/\n│   │   ├── dictionaries/\n│   │   └── routing.ts\n│   ├── lib/\n│   │   ├── validation/\n│   │   ├── seo/\n│   │   ├── security/\n│   │   └── analytics/\n│   └── styles/\n│       ├── tokens.css\n│       └── globals.css\n├── tests/\n│   ├── unit/\n│   ├── integration/\n│   ├── e2e/\n│   └── accessibility/\n└── infrastructure/\n    ├── env.example\n    └── deploy/\n```\n\n### 10.3 Performance\n\n- Images servies dans des formats adaptés, avec `srcset`, dimensions connues, `loading=\"lazy\"` en dehors du hero ; LCP prioritaire pour le visuel principal.\n- Polices auto-hébergées si licences compatibles, subsets par langue ; pas de téléchargement superflu.\n- JS client minimal : pages de contenu en rendu serveur ; hydration réservée au menu, aux filtres et aux formulaires.\n- Réduire les CLS : réserver dimensions médias, barres fixes stables, pas d'injection de blocs sans espace.\n- Budget cible sur les **pages typiques en production**, mesuré sur téléphone moyen et connexion mobile simulée : LCP ≤ 2,5 s, INP ≤ 200 ms, CLS ≤ 0,1 lorsque le contexte de test le permet. Ces nombres sont des **objectifs d'ingénierie**, pas des performances garanties dès ce dossier.\n- Aucune animation indispensable à la compréhension ; `prefers-reduced-motion` entièrement fonctionnel.\n\n### 10.4 Accessibilité\n\n- Objectif **WCAG 2.2 AA** ; audit manuel et automatisé.\n- Ordre de tabulation logique, libellés associés, `aria-live` pour confirmations et erreurs, navigation au clavier complète.\n- Boutons ≥ taille confortable au toucher, liens reconnaissables, contrastes mesurés.\n- `html lang=\"fr\"` ou `lang=\"en\"` sur chaque route ; labels et alt localisés.\n- `Skip to content` : **FR** `Aller au contenu principal` ; **EN** `Skip to main content`.\n- Menus et accordéons respectant les patterns d'interaction usuels, sans verrouillage du focus.\n\n### 10.5 Référencement et localisation\n\n- Métadonnées spécifiques à chaque langue et URL, définies dans §§ 6–8.\n- Canonical auto-référents et balises `hreflang=\"fr\"`, `hreflang=\"en\"`, `hreflang=\"x-default\"` selon mapping des routes ; gestion correcte des pages désactivées.\n- Redirection `/` vers `/fr` ou choix de langue non intrusif ; **ne pas** forcer un basculement basé uniquement sur IP ; garder un sélecteur accessible.\n- Préserver la route homologue lors du changement de langue ; à défaut aller sur la page de catégorie et non sur une 404.\n- `sitemap.xml` ne contenant que les pages publiées ; `robots.txt` raisonnable, staging exclu de l'indexation et protégé.\n- Open Graph et cartes de partage utilisant un visuel de marque officiel ou une composition typographique, jamais une fausse réalisation.\n- Schema.org : `Organization` uniquement avec les champs attestés et valables ; `WebSite`, `BreadcrumbList`, `Service` selon contenus réels. Ne pas inventer `PostalAddress`, `sameAs`, `aggregateRating`, `foundingDate`, `areaServed`, `hasCertification` ni d'avis.\n- Si l'équipe souhaite employer des données structurées locales plus spécifiques, obtenir une adresse et une réalité d'établissement confirmées.\n\n### 10.6 Sécurité et protection des données\n\n- HTTPS obligatoire ; en-têtes de sécurité appropriés (CSP testée, `nosniff`, `referrer-policy`, `permissions-policy`, protection des cookies).\n- Aucun secret dans code, build client, HTML ou dépôt ; configuration d'environnement contrôlée.\n- Formulaires protégés : validation côté serveur, limite de taille, anti-bot discret, rate limiting par stratégie prudente, normalisation des entrées, protections contre injection et stockage malveillant.\n- Journaliser les événements applicatifs sans conserver les messages complets dans les logs ; politique de conservation configurable et documentée.\n- Back-office avec MFA lorsque disponible, contrôle de rôle, séparation des environnements, logs d'audit des éditions sensibles.\n- Aucun transfert de données biométriques ou documents d'identité via les formulaires généraux.\n- Consentement et informations de confidentialité vérifiés au regard du traitement **réel** et des exigences juridiques applicables ; faire valider par le responsable compétent.\n- Aucune bannière de cookies générique si aucun cookie non essentiel n'existe ; si analytics/marketing introduits, prévoir une gestion des préférences correspondant au comportement réel.\n\n---\n\n## 11. Formulaires et cycle de vie d'une demande\n\n### 11.1 Parcours utilisateur V1\n\n```mermaid\nflowchart TD\n  A[Visiteur FR ou EN] --> B[Site principal ou mini-site]\n  B --> C[Contact / Demande de devis]\n  C --> D[Choix du pôle et service facultatifs]\n  D --> E[Coordonnées et description]\n  E --> F{Validation des champs et consentement}\n  F -->|Erreur| E\n  F -->|Valide| G[Contrôle anti-abus côté serveur]\n  G --> H{Enregistrement confirmé}\n  H -->|Non| I[Message d'échec et contact alternatif]\n  H -->|Oui| J[Référence et accusé de réception]\n  J --> K[Notification interne à JT2J si canal configuré]\n```\n\n### 11.2 Données minimales et règles\n\n| Champ | Type | Obligatoire | Notes |\n|---|---|---|---|\n| `intent` | Enum | Oui | `general`, `quote`, `partnership`, `other`. |\n| `divisionCode` | Enum/null | Non | `SEC/LOG/HYG/BIZ/TRV`, pré-rempli par route. |\n| `serviceSlug` | Enum/null | Non | Une des 7 valeurs validées, pré-rempli par route. |\n| `fullName` | Chaîne | Oui | Longueur 2–120, filtrage côté serveur. |\n| `email` | Adresse | Oui | Validation syntaxique et longueur raisonnable. |\n| `phone` | Chaîne | Non | Format international recommandé, sans exigence de pays forcée. |\n| `organization` | Chaîne | Non | Longueur bornée. |\n| `city` | Chaîne | Non | Localité libre. |\n| `message` | Texte | Oui | Min 20 / max 4000 caractères recommandés, sous réserve UX. |\n| `locale` | Enum | Oui | `fr` / `en`. |\n| `consent` | Booléen | Oui si formulaire activé | Consentement et information conformes au traitement réel. |\n| `website` | Honeypot | Non | Ne jamais le rendre visible à l'utilisateur humain. |\n\n**Pièces jointes :** désactivées V1 pour minimiser risque et complexité. Pas de champ biométrique, numéro de passeport, pièce d'identité ou données de santé.\n\n### 11.3 API proposée\n\n`POST /api/inquiries`\n\n**Payload d'exemple — fictif uniquement pour documenter le format, ne pas utiliser comme vrai lead :**\n\n```json\n{\n  \"intent\": \"quote\",\n  \"divisionCode\": \"HYG\",\n  \"serviceSlug\": \"cleaning\",\n  \"fullName\": \"Exemple Test\",\n  \"email\": \"example@example.invalid\",\n  \"phone\": \"\",\n  \"organization\": \"\",\n  \"city\": \"Kolwezi\",\n  \"message\": \"Je souhaite obtenir des renseignements sur une prestation de nettoyage pour un bureau professionnel.\",\n  \"locale\": \"fr\",\n  \"consent\": true\n}\n```\n\n**Succès** : HTTP 201 + identifiant public aléatoire `requestReference` + date serveur ; pas de données sensibles dans le résultat.  \n**Erreurs** : 400 champs invalides ; 429 fréquence excessive ; 503 indisponibilité ; ne jamais exposer stack traces, données privées ou détails de l'infrastructure.\n\nLa référence doit être unique mais **non séquentielle/prévisible**, stockée avec état `received`. Un e-mail de notification ne constitue pas à lui seul la preuve d'un enregistrement durable. Configurer une boîte opérationnelle confirmée avant mise en production.\n\n### 11.4 Suivi interne simple\n\n- Statuts proposés dans l'administration : `received`, `reviewing`, `responded`, `closed`, `spam`.\n- Catégorisation par pôle et service ; recherche, pagination et filtres selon les droits.\n- Export sécurisé réservé aux utilisateurs autorisés ; durée de conservation configurable.\n- Accusé de réception externe ne promettant **aucun délai de réponse non confirmé**.\n- Pas de dashboard « demandes reçues » affiché publiquement.\n\n---\n\n## 12. CMS : contenu, schémas et règles de publication\n\n### 12.1 Entités minimales\n\n```text\nSiteSettings\n  brandName, officialLogoAssetId?, contactEmail, phone, socialHandle,\n  verifiedSocialUrls[], locationsText[fr,en], publicationFlags\n\nDivision\n  code (SEC/LOG/HYG/BIZ/TRV), slug, order,\n  label[fr,en], hero[fr,en], sections[fr,en][],\n  relatedServiceSlugs[], status (draft/review/published/hidden)\n\nService\n  slug, sourcePdfPage=6, divisionCode?, order,\n  title[fr,en], seo[fr,en], lead[fr,en], sections[fr,en][],\n  status (draft/review/published/hidden)\n\nPage\n  pageKey, routeKey, title[fr,en], seo[fr,en], sectionBlocks[],\n  status (draft/review/published/hidden)\n\nAsset\n  id, path, localeAlt[fr,en], licenseStatus,\n  owner, source, isCustomerAsset, permissionStatus, uploadedAt\n\nPerson (feature-gated)\n  fullName, title[fr,en], biography[fr,en]?, portraitAssetId?,\n  verifiedRole, publicationConsent, status\n\nReference (feature-gated)\n  officialName, category?, logoAssetId?, relationshipType,\n  approvedDescription[fr,en]?, publicationPermission, status\n\nInquiry (private)\n  id, publicReference, createdAt, locale, intent, divisionCode?,\n  serviceSlug?, fullName, email, phone?, organization?, city?,\n  message, privacyConsentAt, processingStatus\n\nAuditLog (private)\n  actorId, action, entityType, entityId, timestamp, changeSummary\n```\n\n### 12.2 Statuts et permissions\n\n- `draft` : contenu préparé, jamais visible publiquement.\n- `review` : en attente de vérification, exclu de l'indexation.\n- `published` : visible après contrôle de traductions et de permissions.\n- `hidden` : conservé pour l'équipe mais absent du sitemap et du site.\n\n**Rôles** : `super_admin` (configuration, permissions), `editor` (contenus FR/EN), `reviewer` (validation de publication), `inquiries_agent` (demandes, sans édition de contenus). Ne pas confier les mêmes accès à tous les pôles par défaut.\n\n### 12.3 Garde-fous automatiques\n\n- Empêcher la publication d'une section `Reference` sans `publicationPermission=true`.\n- Empêcher la publication d'une `Person` sans `verifiedRole=true` et consentement aux portraits si portrait présent.\n- Empêcher la publication d'une page qui n'a pas de traduction complète dans les deux langues ; sinon la garder en brouillon.\n- Enregistrer les modifications et permettre une restauration de version.\n- Liens internes choisis parmi les routes existantes ; détecter les liens cassés.\n- Pour les images, exiger un alt utile ou marquer explicitement `decorative=true`.\n- Conserver le champ `sourceNote` facultatif pour référencer la page PDF ou une approbation ultérieure.\n\n### 12.4 Feature flags initiaux\n\n```yaml\nflags:\n  leadership_public: false\n  references_public: false\n  testimonials_public: false\n  certifications_public: false\n  public_case_studies: false\n  contact_form_public: false    # true seulement une fois conformité + boîte + API testées\n  online_payments: false\n  live_booking: false\n  customer_portal: false\n  gps_tracking_portal: false\n  biometric_data_intake: false\n  show_social_links: false      # handle text visible, URL uniquement après vérification\n  show_physical_map: false     # adresse exacte non fournie\n  use_official_logo: false     # true après livraison du fichier original\n```\n\n**Ces valeurs ont vocation à être ajustées de manière explicite avant publication**, pas à être contournées par un composant frontend.\n\n---\n\n## 13. Inventaire de tous les visuels et ressources\n\n| ID | Placement | Contenu attendu | Plan sans actif officiel |\n|---|---|---|---|\n| `BRAND-01` | Header, Footer, favicon, partage | Logo JT2J authentique | Wordmark typographique provisoire (ne pas inventer aigle). |\n| `IMG-01` | Hero principal | Photographie générale contextualisée licenciée OU motif abstrait | Composition typographique et tracés vectoriels sobres. |\n| `IMG-02` | À propos | Vrai visuel JT2J autorisé, si fourni | Architecture graphique ; aucune photo de fausse équipe. |\n| `DIV-SEC` | Mini-site SEC | Visuel de sécurité générique sous licence | Motifs géométriques abstraits. |\n| `DIV-LOG` | Mini-site LOG | Transport générique sans marque JT2J | Réseau de lignes et points abstraits. |\n| `DIV-HYG` | Mini-site HYG | Environnements entretenus génériques autorisés | Surface neutre/texturée légère. |\n| `DIV-BIZ` | Mini-site BIZ | Collaboration / fourniture générique | Formes éditoriales. |\n| `DIV-TRV` | Mini-site TRV | Paysages génériques géographiquement non revendiqués | Typographie et composition chromatique. |\n| `LEAD-XX` | Direction [V] | Portrait avec permission | Module absent. |\n| `REF-XX` | Références [V] | Logo partenaire/client autorisé | Module absent. |\n| `CASE-XX` | Portfolio [V] | Photos réelles + autorisation | Module absent. |\n| `OPEN-GRAPH` | Partage | Compositions marque sans affirmation chiffrée | Générer depuis logo authentique ou wordmark. |\n\n**Métadonnées d'asset :** origine, titulaire des droits, type de licence, lieu si certifié, date, autorisation de diffusion, alt FR/EN, restriction géographique et durée si applicable. Ne pas intégrer des visuels du collage PDF comme s'ils étaient des fichiers source haute définition et libres d'utilisation.\n\n### 13.1 Alt text — base bilingue\n\n| Visuel | FR | EN |\n|---|---|---|\n| Logo officiel | Logo JT2J Company | JT2J Company logo |\n| Motif purement décoratif | Alt vide (`alt=\"\"`) | Empty alt (`alt=\"\"`) |\n| Image transport générique | Illustration d'une activité de transport. | Illustration of a transport activity. |\n| Image espace entretenu | Illustration d'un espace professionnel entretenu. | Illustration of a maintained professional space. |\n| Photo réelle de dirigeant [V] | Portrait de {nom confirmé}. | Portrait of {verified name}. |\n\nNe pas écrire « Équipe JT2J au travail » sous une image stock.\n\n---\n\n## 14. Parcours, mise en page et responsive — instructions de production\n\n### 14.1 Desktop (≈ 1200 px et au-delà)\n\n- En-tête sobre d'une hauteur proportionnée, logo à gauche, navigation au centre/droite, CTA distinct.\n- Hero généralement en deux zones éditoriales : grand contenu texte et visuel réel autorisé ou abstraction ; ne pas fabriquer systématiquement un visuel 3D spectaculaire.\n- Sections alternant textes et médias, avec hiérarchie claire. L'ordre de lecture doit rester le même que l'ordre du DOM.\n- Pied de page présentant coordonnées, pôles et liens institutionnels ; pas de bloc « Newsletter » non demandé.\n\n### 14.2 Tablette (≈ 768–1199 px)\n\n- Réduction progressive de la grille ; taille de titres `clamp()`.\n- Header comprimé ou menu replié selon la place réelle ; pas de collisions FR/EN.\n- Deux colonnes maximum pour l'index des cinq pôles et des sept services.\n\n### 14.3 Mobile (≈ 320–767 px)\n\n- Menu accessible occupant une zone claire et facilement refermable.\n- Contenu en une colonne, aucun défilement horizontal involontaire.\n- Textes suffisamment larges pour être lisibles sans zoom, CTA tactiles.\n- Visuels recadrés soigneusement, sans détériorer les sujets photographiés ; pas de titres par-dessus des zones trop détaillées.\n- Bouton d'appel `tel:` utilisable ; formulaires sans surcharge et avec `autocomplete`.\n- Mise en page vérifiée notamment aux largeurs 320, 360, 390, 430 px.\n\n### 14.4 Interaction entre les six expériences\n\n- Le logo principal renvoie systématiquement à l'accueil JT2J de la langue courante.\n- Chaque mini-site possède un lien visible « JT2J Company » permettant de retrouver le portail.\n- Le menu global reste disponible depuis les mini-sites.\n- Un service ne doit **jamais enfermer** le visiteur dans un pôle.\n- Le bouton de langue garde la page, le service et le pôle actuels.\n- Après l'envoi d'un formulaire, ne pas perdre le contexte de langue ni le service choisi.\n\n---\n\n## 15. Planning de développement — lots et livrables\n\nLes lots décrivent des **conditions de complétion**, pas des durées promises.\n\n### Lot 0 — Fondation du projet\n\n- Dépôt privé, documentation, environnement d'exécution, conventions TypeScript, lint/format, tests de base.\n- Structure multi-locale FR/EN et routes définies.\n- Import du contenu de ce dossier comme source initiale.\n- Palette et typographies révisables ; logo officiel si disponible.\n- **Terminé lorsque** : toutes les routes génériques répondent, langue persistante, CI verte.\n\n### Lot 1 — Design system et portail corporate\n\n- Header, footer, composants de base, home, company, expertise, services, approach, FAQ, contact.\n- Contenu réel bilingue §§ 5–6 ; SEO initial ; a11y de base.\n- **Terminé lorsque** : les pages corporate fonctionnent sur desktop et mobile sans contenu factice.\n\n### Lot 2 — Les cinq mini-sites\n\n- Un template solide + cinq déclinaisons ; routes, textes §§ 7, signature visuelle, navigation contextualisée.\n- **Terminé lorsque** : les cinq mini-sites sont complets en FR/EN, liens internes vérifiés, aucune offre fictive.\n\n### Lot 3 — Les sept services\n\n- Pages détaillées § 8, métadonnées, liens vers pôles, CTA préremplis.\n- **Terminé lorsque** : 14 routes de services (7 × 2 langues) fonctionnelles, contenus conformes.\n\n### Lot 4 — Administration et demandes\n\n- CMS/back-office minimal ou workflow éditorial versionné ; gestion traduction et publication ; formulaires si cadre validé.\n- **Terminé lorsque** : mise à jour d'un service sans code, contrôles d'accès, logs utiles, soumission vérifiable sans fuite.\n\n### Lot 5 — Qualité et exploitation\n\n- SEO, performance, sécurité, accessibilité, tests manuels et automatisés, staging, runbook, sauvegardes.\n- **Terminé lorsque** : critères § 17 respectés et fiche de validation de publication résolue.\n\n### Lot 6 — Livraison\n\n- Documentation d'installation et exploitation, comptes remis par canal sécurisé, formation administrateur, rapport des tests, démonstration.\n- **Terminé lorsque** : version de production stable, méthode de restauration documentée, contenus approuvés.\n\n---\n\n## 16. Fiche **ultra-courte** de validation JT2J avant publication\n\nCette fiche **n'empêche pas le développement**. Elle remplace les questionnaires longs. Ne la transmettre qu'au moment adéquat ou joindre les ressources reçues spontanément.\n\n1. **Identité et logo** : fichier officiel du logo + confirmation du nom exact à afficher.\n2. **Équipe et relations** : validation des noms/fonctions des dirigeants, du rôle de MYM Advisor et de la mention éventuelle du Canada **uniquement si la page Direction doit être publiée**.\n3. **Références** : autorisation et nature des liens pour les cinq noms de la page 9 **uniquement si la page Références doit être publiée**.\n4. **Contacts et mise en ligne** : confirmation que l'e-mail et le téléphone fonctionnent ; domaine et personne habilitée à valider la publication.\n5. **Mentions et données** : éléments nécessaires aux mentions légales et à la politique de confidentialité selon les données réellement traitées.\n\n**Décision automatique en l'absence de réponse :** logo typographique temporaire si fichier non fourni, pages Direction/Références/certifications masquées, absence de carte postale et de liens réseaux non confirmés, site prêt sur staging, formulaires désactivés si conformité ou réception des données non testées. **Ne pas ouvrir au public une version qui se prétend juridiquement complète si les mentions obligatoires sont inconnues.**\n\n---\n\n## 17. Recette finale / Definition of Done — critères vérifiables\n\n### 17.1 Contenus et informations\n\n- [ ] Cinq pôles, avec **orthographe et ordre conformes** à la page 1.\n- [ ] Sept services, avec **périmètre conforme** à la page 6 ; descriptions EN/FR présentes.\n- [ ] Mission, vision et sept valeurs conformes à leurs sources, sans promesses ajoutées.\n- [ ] Coordonnées conformes à la page 11 et liens mail/téléphone fonctionnels.\n- [ ] Aucune adresse, date, certification, chiffre, client, tarif, réalisation ou délai inventé.\n- [ ] Références et direction absentes du public sauf validation explicite.\n- [ ] Aucun texte `Lorem ipsum`, `TODO` ou placeholder visible sur le site public.\n- [ ] Aucun ancien support du PDF présenté comme « projet JT2J réalisé » sans autorisation.\n\n### 17.2 Fonctionnement\n\n- [ ] Toutes les routes de § 2 rendues en FR et EN, 200 ou masquées par flag si conditionnelles.\n- [ ] Navigation interne, breadcrumbs, retours et changement de langue sans 404.\n- [ ] Boutons de menu, sous-menus, accordéon FAQ, liens de contact fonctionnels.\n- [ ] Aucun bouton trompeur de paiement, réservation ou suivi GPS inexistant.\n- [ ] Formulaire testé contre soumission vide, email invalide, abus, doubles clics, indisponibilité serveur.\n- [ ] La confirmation de demande n'est montrée qu'en cas d'enregistrement réel.\n- [ ] Aucune donnée personnelle dans URL, historique frontend, logs publics ou outils analytics non autorisés.\n\n### 17.3 Qualité\n\n- [ ] Tests visuels aux largeurs 320 / 360 / 390 / 430 / 768 / 1024 / 1440 px.\n- [ ] Aucun débordement, chevauchement, texte coupé, menu invisible ou bouton hors écran.\n- [ ] Audit clavier et lecteur d'écran sur principaux parcours.\n- [ ] Contrastes et focus conformes à l'objectif WCAG 2.2 AA.\n- [ ] Animations réduites correctement gérées.\n- [ ] Images licenciées, alt adaptés, lazy load hors LCP, absence de décalage majeur.\n- [ ] Mesures LCP / INP / CLS enregistrées sur staging/production selon § 10.3.\n- [ ] Titres/meta/hreflang/sitemap/canonical validés dans les deux langues.\n- [ ] Aucun index du staging ; aucune page non approuvée indexable.\n- [ ] Aucun secret commité, authentification CMS robuste, rate limiting, validation serveur.\n- [ ] Sauvegarde et restauration testées si base ou médias persistants.\n\n### 17.4 Livraison\n\n- [ ] `README` installation/commandes d'exécution/déploiement.\n- [ ] `.env.example` sans secrets ; variables décrites.\n- [ ] Inventaire des médias, licences et permissions.\n- [ ] Exports de contenus et procédure de mise à jour.\n- [ ] Procédure de rollback et de restauration.\n- [ ] Rapport des tests avec anomalies résolues ou acceptées explicitement.\n- [ ] Fiche des validations client renseignée ; pas de mise en ligne prématurée.\n\n---\n\n## 18. Jeux de tests à automatiser\n\n| ID | Scénario | Résultat attendu |\n|---|---|---|\n| `E2E-001` | Ouvrir `/fr`, choisir EN | `/en` ; H1 et navigation anglais. |\n| `E2E-002` | Depuis `/fr/services/cleaning`, changer de langue | ` rivez les locaux et la nature de la prestation recherchée. | Need hygiene, cleaning or maintenance services? | Describe the premises and the service you are looking for. |\n| BIZ | Un besoin professionnel à présenter ? | Contactez le pôle Business & Marketing pour préciser votre projet. | Have a business need to discuss? | Contact the Business & Marketing division to clarify your project. |\n| TRV | Vous préparez un déplacement ? | Parlez de votre projet de voyage et de l'accompagnement recherché. | Planning a trip? | Tell us about your travel plans and the support you need. |\n\n### 20.2 Mini-descriptions de pôles pour menus et cartes\n\n| Code | FR | EN |\n|---|---|---|\n| SEC | Un pôle consacré à la sécurité et à la biométrie. | A division focused on security and biometrics. |\n| LOG | Transport et assistance logistique figurent parmi les activités présentées. | Transport and logistics assistance are among the listed activities. |\n| HYG | Lutte contre les nuisibles, nettoyage et assainissement des espaces. | Pest control, cleaning and sanitation of premises. |\n| BIZ | Une orientation business et marketing, avec une activité de fourniture mentionnée au profil. | A business and marketing focus, with supply activities included in the profile. |\n| TRV | Organisation de voyages, assistance aux voyageurs et tourisme. | Travel arrangements, traveller assistance and tourism. |\n\n### 20.3 Mini-descriptions des sept services pour cartes (FR / EN)\n\n| Service | Français | English |\n|---|---|---|\n| Pest Control & Extermination | Lutte contre les nuisibles, dératisation et désinsectisation. | Pest management, rodent control and insect control. |\n| Cleaning Services | Nettoyage et entretien de maisons, bureaux, commerces et bâtiments professionnels. | Cleaning and upkeep for homes, offices, shops and professional buildings. |\n| Travel & Tourism | Organisation de voyages, assistance aux voyageurs et services touristiques. | Travel arrangements, assistance for travellers and tourism services. |\n| Disinfection & Sanitation | Désinfection des locaux et services d'assainissement. | Premises disinfection and sanitation services. |\n| Facility Management | Entretien et gestion des installations et bâtiments. | Maintenance and management of facilities and buildings. |\n| Transport & Logistics | Transport de personnes ou de marchandises et assistance logistique. | Passenger or goods transport and logistics assistance. |\n| General Trading & Supply | Fourniture de produits, équipements et matériels professionnels. | Supply of products, equipment and professional materials. |\n\n### 20.4 Libellés d'onglets / navigation de second niveau\n\n| FR | EN |\n|---|---|\n| Présentation | Overview |\n| Nos services | Our services |\n| Notre démarche | Our approach |\n| Autres services | Related services |\n| Demander des informations | Request information |\n| Faire une demande | Send an enquiry |\n| En savoir plus | Learn more |\n| Découvrir le pôle | Explore the division |\n| Revenir aux pôles | Back to divisions |\n| Voir les coordonnées | View contact details |\n| Informations vérifiées | Verified information |\n\n---\n\n## 21. Gouvernance de contenu et arbitrages explicites\n\n### 21.1 Résolution des incohérences du profil\n\n1. **Cinq pôles / sept secteurs :** les cinq pôles servent de navigation institutionnelle ; les sept secteurs alimentent un index de services distinct. Les rattachements sont des choix d'UX, non la preuve que telle filiale exécute tel contrat.\n2. **Sécurité, tracking, marketing :** pages de pôles publiables mais sans liste technique détaillée, faute de descriptions assez précises dans le PDF.\n3. **Canada :** conserver l'information uniquement dans la documentation de travail ; aucune présence territoriale affichée hors RDC en V1 tant que la situation n'est pas confirmée.\n4. **Direction :** informations nominatives préparées en § 6, publication désactivée, pas d'organigramme supposé.\n5. **Références :** les cinq noms s
